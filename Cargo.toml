[package]
name = "empetri"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
egui = "0.37.0"
log = "0.4.35"
rodio = "0.23.0"
simplelog = "0.12.2"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"

